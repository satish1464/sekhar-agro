<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sekhar Agro Catalog</title>
<meta name="description" content="Sekhar Agro farm-to-home online ordering catalog">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f4;font-family:Arial,Helvetica,sans-serif;color:#222}
header{background:#075e54;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:5}
.header-row{max-width:800px;margin:auto;display:flex;align-items:center;gap:10px}
.logo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;flex:0 0 56px}
.brand h1{margin:0;font-size:23px;line-height:1.05} .brand p{margin:4px 0 0;font-size:12px;opacity:.95}
.catnav{background:#fff;position:sticky;top:76px;z-index:4;display:flex;gap:7px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid #ddd;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav a{white-space:nowrap;text-decoration:none;background:#edf7ef;color:#075e54;border:1px solid #cfe2d5;border-radius:18px;padding:7px 10px;font-size:11px;font-weight:bold}
.wrap{max-width:800px;margin:auto;padding:10px 10px 120px}
.search{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;background:#fff;margin:2px 0 8px}
h2{color:#075e54;font-size:18px;margin:18px 0 8px;scroll-margin-top:125px}
.product{background:#fff;border-radius:12px;padding:9px 10px;margin:7px 0;display:grid;grid-template-columns:45px minmax(0,1fr) 92px auto 62px;align-items:center;gap:8px;box-shadow:0 2px 8px #0001}
.thumb{width:45px;height:45px;border-radius:10px;background:#edf7ef;display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1;flex:0 0 45px}
.details{flex:1;min-width:105px} .details b{display:block;font-size:13px;line-height:1.2} .details span{font-size:11px;color:#666}
.selectwrap{width:92px} select{width:100%;padding:8px 5px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:11px}
.qtypicker{display:flex;align-items:center;border:1px solid #ccc;border-radius:8px;overflow:hidden;height:34px}
.qtypicker button{border:0;background:#edf7ef;color:#075e54;width:26px;height:32px;font-size:18px;font-weight:bold;cursor:pointer}
.qtypicker span{width:24px;text-align:center;font-size:12px;font-weight:bold}
.amount{width:62px;text-align:right;color:#075e54;font-weight:bold;font-size:12px}
.panel{display:none;background:#fff;border-radius:13px;padding:14px;margin-top:18px}
.panel.show{display:block}
.line{display:grid;grid-template-columns:minmax(0,1fr) 80px 68px;gap:7px;padding:7px 0;border-bottom:1px solid #eee;align-items:start}
.line .pname{font-size:12px} .line .pqty{font-size:11px;color:#555;text-align:right} .line .pprice{font-size:12px;font-weight:bold;text-align:right;color:#075e54}
.bill-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;color:#43513d}
.bill-row span:last-child{font-weight:700}
.delivery-message{margin:8px 0 4px;padding:9px 12px;border-radius:10px;background:#f0f9e9;color:#4f8f25;font-weight:700;font-size:14px}
.delivery-message.delivery-paid{background:#fff7e6;color:#a46300}
.delivery-message.delivery-free{background:#eaf8e2;color:#397d20}
.order-delivery-note{font-weight:700;color:#4f8f25}
.total{display:grid;grid-template-columns:1fr 68px;gap:7px;font-size:18px;font-weight:bold;padding-top:12px}
.total span:last-child{text-align:right;color:#075e54}
input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:5px 0 10px}
.confirm,.cart button{width:100%;border:0;border-radius:9px;padding:14px;font-weight:bold;font-size:16px}
.confirm{background:#075e54;color:#fff;cursor:pointer}
.cart{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px;z-index:10}
.cart button{background:#25d366;color:#fff;max-width:800px;display:block;margin:auto;cursor:pointer}
.small{font-size:11px;color:#777}
.empty{padding:18px 0;color:#777;text-align:center}
/* Mobile-safe bill alignment */
.line{grid-template-columns:minmax(0,1fr) 80px 70px;gap:8px;}
.line .pname{min-width:0;overflow-wrap:anywhere;word-break:break-word;}
.line .pqty,.line .pprice{white-space:nowrap;}
.total{grid-template-columns:minmax(0,1fr) 70px;}
@media(max-width:520px){
 .product{grid-template-columns:42px minmax(0,1fr) 52px;grid-template-areas:"icon name amount" "icon select qty";gap:6px;padding:8px}
 .thumb{grid-area:icon;width:42px;height:42px;font-size:23px}
 .details{grid-area:name;min-width:0}
 .details b{font-size:12px;line-height:1.25}
 .details span{font-size:10px}
 .selectwrap{grid-area:select;width:100%}
 .selectwrap select{font-size:10px;padding:7px 4px}
 .qtypicker{grid-area:qty;justify-self:end;width:52px}
 .qtypicker button{width:18px}
 .qtypicker span{width:16px}
 .amount{grid-area:amount;width:auto;font-size:11px}
 .line{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name price" "qty price";gap:2px 8px;padding:9px 0}
 .line .pname{grid-area:name;font-size:12px;line-height:1.25}
 .line .pqty{grid-area:qty;text-align:left;font-size:11px;color:#666}
 .line .pprice{grid-area:price;align-self:center;font-size:13px;white-space:nowrap}
 .total{grid-template-columns:1fr auto;font-size:18px}
 .catnav{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
 .catnav a{display:inline-block}
}

/* Sekhar Agro catalog: clean parrot-green ordering layout */
:root{--parrot:#66b032;--parrot-dark:#4f8f25;--parrot-pale:#f0f9e9;--ink:#263522;--line:#dbe8d2}
body{background:linear-gradient(180deg,#f8fcf5,#edf8e7)!important;color:var(--ink)!important}
header{background:linear-gradient(135deg,#4f8f25,#78bd45)!important}
.catnav{background:#fff!important;border-bottom:2px solid #d8e9ce!important}
.catnav a{color:#4f8f25!important;font-weight:700}
.product{display:grid!important;grid-template-columns:58px minmax(0,1fr) 190px 82px;gap:12px;align-items:center;padding:11px 10px!important;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;box-shadow:0 3px 12px rgba(70,120,40,.07)}
.thumb.emoji-thumb{width:50px!important;height:50px!important;border-radius:12px;background:var(--parrot-pale);display:flex!important;align-items:center;justify-content:center;font-size:30px;line-height:1}
.details{min-width:0}
.details b{display:block;font-size:14px;line-height:1.3}
.details span{display:none!important}
.selectwrap{width:100%}
.selectwrap select{width:100%;padding:9px 8px;border:1px solid #cfe1c4;border-radius:9px;background:#fbfef9;color:#263522;font-weight:600}
.amount{text-align:right;font-weight:800;color:var(--parrot-dark);white-space:nowrap}
.line{display:grid!important;grid-template-columns:minmax(0,1fr) 110px 90px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #e7eee2}
.line .pname{min-width:0;overflow-wrap:anywhere}
.line .pqty,.line .pprice{white-space:nowrap}
.line .pprice{text-align:right;font-weight:800;color:var(--parrot-dark)}
.total{grid-template-columns:1fr auto!important}
.confirm{background:var(--parrot-dark)!important}
.cart button{background:#25d366!important}
@media(max-width:700px){
 .product{grid-template-columns:50px minmax(0,1fr) 125px 68px!important;gap:8px;padding:9px!important}
 .thumb.emoji-thumb{width:44px!important;height:44px!important;font-size:25px}
 .details b{font-size:12px}
 .selectwrap select{font-size:11px;padding:8px 5px}
 .amount{font-size:12px}
 .line{grid-template-columns:minmax(0,1fr) 82px 70px!important}
}
@media(max-width:480px){
 .product{grid-template-columns:44px minmax(0,1fr) 108px 58px!important;gap:6px}
 .thumb.emoji-thumb{width:40px!important;height:40px!important;font-size:22px}
 .selectwrap select{font-size:10px;padding:7px 3px}
 .amount{font-size:11px}
 .line{grid-template-columns:minmax(0,1fr) auto!important;grid-template-areas:"name price" "qty price";gap:2px 8px}
 .line .pname{grid-area:name}
 .line .pqty{grid-area:qty;text-align:left;color:#666;font-size:11px}
 .line .pprice{grid-area:price;align-self:center}
}


.photo-thumb{width:56px!important;height:56px!important;border-radius:12px;background:var(--parrot-pale);display:flex!important;align-items:center;justify-content:center;overflow:hidden;font-size:32px;line-height:1}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb.image-fallback{font-size:32px}
@media(max-width:700px){.photo-thumb{width:48px!important;height:48px!important}}
</style>
</head>

function productImage(p){ return productImageMap[String(p.id)] || ""; }

const state = {};

function productEmoji(p){ return p.emoji || "🛍️"; }

function ensureState(p){
  if(!state[p.id]) state[p.id]={variant:-1};
  return state[p.id];
}

function money(n){ return "Rs. " + Math.round(n); }

function renderProducts(){
  const term=(document.getElementById("search").value||"").trim().toLowerCase();
  const root=document.getElementById("catalog");
  let html="";
  categories.forEach(([cat,title])=>{
    const list=products.filter(p=>p.cat===cat && p.name.toLowerCase().includes(term));
    if(!list.length) return;
    html += `<h2 id="${cat}">${title}</h2>`;
    list.forEach(p=>{
      const s=ensureState(p);
      const selected=s.variant>=0 ? p.variants[s.variant] : null;
      const amount=selected ? selected.price : 0;
      html += `
        <div class="product">
          <div class="thumb photo-thumb" aria-label="${p.name}">${productImage(p) ? `<img src="${productImage(p)}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('image-fallback');this.parentElement.insertAdjacentText('beforeend', productEmoji(p));">` : productEmoji(p)}</div>
          <div class="details"><b>${p.name}</b></div>
          <div class="selectwrap">
            <select aria-label="Select quantity for ${p.name}" onchange="setVariant(${p.id},this.value)">
              <option value="-1" ${s.variant<0?"selected":""}>Select quantity</option>
              ${p.variants.map((x,i)=>`<option value="${i}" ${i===s.variant?"selected":""}>${x.label} · ${money(x.price)}</option>`).join("")}
            </select>
          </div>
          <div class="amount" id="a${p.id}">${money(amount)}</div>
        </div>`;
    });
  });
  root.innerHTML=html || '<div class="empty">No products found.</div>';
}

function setVariant(id,index){
  const p=products.find(x=>x.id===id);
  const s=ensureState(p);
  s.variant=Number(index);
  updateRow(p);
  updateCartText();
  updateBillDisplay();
}

function updateRow(p){
  const s=ensureState(p);
  const a=document.getElementById("a"+p.id);
  const v=s.variant>=0 ? p.variants[s.variant] : null;
  if(a) a.textContent=money(v ? v.price : 0);
}

function updateCartText(){
  const n=Object.values(state).filter(s=>s.variant>=0).length;
  document.getElementById("cartText").textContent=n+(n===1?" item":" items");
}

function selectedLines(){
  const lines=[];
  products.forEach(p=>{
    const s=ensureState(p);
    if(s.variant<0) return;
    const v=p.variants[s.variant];
    lines.push({p,s,v,total:v.price});
  });
  return lines;
}

function calculateBill(){
  const lines=selectedLines();
  const subtotal=lines.reduce((sum,x)=>sum+x.total,0);
  // Orders below Rs. 500 have a Rs. 40 delivery charge.
  // Orders of Rs. 500 or more get free delivery.
  const delivery=subtotal>0 && subtotal<500 ? 40 : 0;
  const grandTotal=subtotal+delivery;
  return {lines,subtotal,delivery,grandTotal};
}

  const bill=calculateBill();
  const subEl=document.getElementById("subtotalAmount");
  const delEl=document.getElementById("deliveryAmount");
  const totalEl=document.getElementById("grandTotal");
  const msgEl=document.getElementById("deliveryMessage");
  if(subEl) subEl.textContent=money(bill.subtotal);
  if(delEl) delEl.textContent=bill.delivery ? money(bill.delivery) : "FREE";
  if(totalEl) totalEl.textContent=money(bill.grandTotal);
  if(msgEl){
    if(bill.subtotal===0){
      msgEl.textContent="Add items to see delivery charges.";
      msgEl.className="delivery-message";
    } else if(bill.subtotal<500){
      msgEl.textContent=`Add ${money(500-bill.subtotal)} more to get FREE delivery.`;
      msgEl.className="delivery-message delivery-paid";
    } else {
      msgEl.textContent="🎉 FREE delivery on orders of Rs. 500 or above.";
      msgEl.className="delivery-message delivery-free";
    }
  }
  return bill;
}

function showOrder(){
  const bill=calculateBill();
  const lines=bill.lines;
  const panel=document.getElementById("orderPanel");
  panel.classList.add("show");
  const summary=document.getElementById("summary");
  if(!lines.length){
    summary.innerHTML='<div class="empty">Your cart is empty.</div>';
  } else {
    summary.innerHTML=lines.map((x,i)=>{
      return `<div class="line">
        <div class="pname"><b>${i+1}. ${x.p.name}</b></div>
        <div class="pqty">${x.v.label}</div>
        <div class="pprice">${money(x.total)}</div>
      </div>`;
    }).join("");
  }
  updateBillDisplay();
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}

function createOrderNumber(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const date=pad(now.getDate())+pad(now.getMonth()+1)+now.getFullYear();
  const dayKey=`sekharOrderSequence_${date}`;
  let seq=Number(localStorage.getItem(dayKey)||0)+1;
  localStorage.setItem(dayKey,String(seq));
  return `SA-${date}-${String(seq).padStart(3,"0")}`;
}

function sendWhatsApp(){
  const lines=selectedLines();
  if(!lines.length){ alert("Please select a quantity from the dropdown for at least one product."); return; }
  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const address=document.getElementById("customerAddress").value.trim();
  if(!name || !phone || !address){
    alert("Please enter customer name, mobile number and delivery address.");
    return;
  }

  const bill=calculateBill();
  const orderNo=createOrderNumber();
  const items=bill.lines.map((x,i)=>{
    return `${i+1}. ${x.p.name} — ${x.v.label} — ${money(x.total)}`;
  });
  const deliveryText=bill.delivery ? money(bill.delivery) : "FREE";

  const msg =
`*SEKHAR AGRO - NEW ORDER*

*Order No: ${orderNo}*

${items.join("\n")}

*Subtotal: ${money(bill.subtotal)}*
*Delivery: ${deliveryText}*
*GRAND TOTAL: ${money(bill.grandTotal)}*

🚚 *Order today and get delivery within 24 hours.*

*Customer Details*
Name: ${name}
Mobile: ${phone}
Address: ${address}`;

  const url="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank","noopener");
}

renderProducts();
updateCartText();
</script>
